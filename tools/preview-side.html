<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色 · 侧身角度小样</title>
<style>*{margin:0;padding:0}html,body{background:#0d0f12}canvas{display:block}</style>
</head>
<body>
<!--
  「侧身一点的模型」小样：**不改游戏代码**（drawPlayer 一行没动）。
  底座用「③ 头带·短打·佩剑」（上一轮最能认出"剑客"的那套），只换**侧身角度**这个变量：

    ① 正面 0°（对照）  ② 侧 1/4（约 30°）  ③ 半侧（约 55°）  ④ 正侧（约 85°）

  上行 = 待机·面朝右；下行 = 挥砍·面朝左（整体镜像，顺便看左右翻的效果）。

  ⚠️ 侧身**不是"把正面乘个系数"**就行的（第一版这么写，四列几乎一个样）：
     每个角度得单独定这几处 —— 眼睛位置/远侧眼藏不藏、鼻子多大、后脑头发鼓多少、
     身体半宽、肩线往前偏多少、两腿一前一后差多少、佩剑往后转多少。
     所以下面用一张**每个角度一套手调数值**的表，而不是乘 T。

  游戏里落地时按移动方向水平镜像（cos(face) 的符号），所以只需要"面朝右"这一套 + 翻转。
  用法：bash tools/shot-boss.sh side   → docs/player-side.png
-->
<canvas id="out" width="812" height="430"></canvas>
<script>
(function () {
  try {
  var CW = 203, CH = 190, COLS = 4, ZOOM = 2.3;
  var outCv = document.getElementById('out');
  outCv.width = COLS * CW;
  outCv.height = 2 * (CH + 20) + 18;
  var ctx = outCv.getContext('2d');

  var OUT = '#1b1f26';
  var SKIN = '#f2cda6', HAIR = '#141519';
  var ROBE = '#37587f', ROBE_D = '#2b4666', SASH = '#c9a24a', SASH_D = '#8f6f26';

  function rr(x, y, w, h, r) {
    var q = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + q, y); ctx.lineTo(x + w - q, y); ctx.arcTo(x + w, y, x + w, y + q, q);
    ctx.lineTo(x + w, y + h - q); ctx.arcTo(x + w, y + h, x + w - q, y + h, q);
    ctx.lineTo(x + q, y + h); ctx.arcTo(x, y + h, x, y + h - q, q);
    ctx.lineTo(x, y + q); ctx.arcTo(x, y, x + q, y, q); ctx.closePath();
  }
  function fs(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = lw || 1.7; ctx.stroke(); }
  function limb(x1, y1, x2, y2, w, col) {
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 2.4; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }
  function eyeDot(ex, ey, r, squint) {
    ctx.lineCap = 'round';
    if (squint) {
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ex - 1.4, ey - 1.3); ctx.lineTo(ex + 1.3, ey + 1.1); ctx.stroke();
    } else { ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(ex, ey, r, 0, 7); ctx.fill(); }
  }

  /**
   * 每个侧身角度一套**手调**数值（乘系数那个做法四列几乎一个样，已废）。
   *   hx    头往朝向偏多少
   *   hr    头的横向缩放（侧了会略窄）
   *   eyeN  近侧眼离头心多远 / eyeF 远侧眼（null = 藏掉）
   *   nose  鼻尖伸出多少（0 = 正面不画）
   *   hairB 后脑头发往后鼓多少
   *   hw    身体半宽 / shX 肩线往朝向偏多少
   *   legF/legB 前腿/后腿的 x 偏移
   *   swX/swR   佩剑往后挪多少 / 转多少
   *   rib   飘带向后飘的幅度
   */
  var ANG = [
    { name: '① 正面 0°（对照）', deg: 0,    hx: 0,   hr: 1.00, eyeN: 3.3, eyeF: -3.3, nose: 0,   hairB: 0,   hw: 12, shX: 0,   legF: 1.5, legB: -8,   swX: -1.5, swR: 0,    rib: 0 },
    { name: '② 侧 1/4（约 30°）', deg: 30,  hx: 2.6, hr: 0.95, eyeN: 3.5, eyeF: -1.6, nose: 0.9, hairB: 1.8, hw: 10.5, shX: 1.4, legF: 2.8, legB: -7.2, swX: -3.5, swR: 0.20, rib: 1.2 },
    { name: '③ 半侧（约 55°）',   deg: 55,  hx: 3.8, hr: 0.90, eyeN: 3.7, eyeF: null, nose: 1.7, hairB: 3.6, hw: 9.0,  shX: 2.6, legF: 4.4, legB: -5.6, swX: -5.5, swR: 0.45, rib: 2.4 },
    { name: '④ 正侧（约 85°）',   deg: 85,  hx: 4.6, hr: 0.84, eyeN: 3.9, eyeF: null, nose: 2.4, hairB: 5.2, hw: 7.6,  shX: 3.4, legF: 5.8, legB: -4.2, swX: -7.0, swR: 0.60, rib: 3.4 }
  ];

  /** 角色（面朝右那一套；要朝左整体镜像）。A = ANG 里的一行，sw = 挥砍 */
  function drawChar(P, A, sw) {
    var x = P.x, y0 = P.y - 42, step = P.step || 0;
    var hx = x + A.hx;

    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x + A.shX * 0.4, P.y + 3, 17 - A.deg * 0.03, 6, 0, 0, 7); ctx.fill();

    /* ---- 后腿（压暗、往后错） ---- */
    function leg(dx, lift, col, boot) {
      rr(x + dx, P.y - 17, 6.8, 17 - lift, 2.6); fs(col, 1.6);
      ctx.strokeStyle = '#6c6152'; ctx.lineWidth = 1.3;
      for (var w = 0; w < 2; w++) {
        var wy = P.y - 15 + w * 5 - lift;
        ctx.beginPath(); ctx.moveTo(x + dx - 0.5, wy); ctx.lineTo(x + dx + 7.3, wy + 2.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + dx - 0.5, wy + 2.6); ctx.lineTo(x + dx + 7.3, wy); ctx.stroke();
      }
      rr(x + dx - 1.5, P.y - 4 - lift, 9.8, 5.6, 2); fs(boot, 1.6);
    }
    leg(A.legB - step * 1.6, Math.max(0, -step) * 2.6, '#2f2a20', '#1b1e22');

    /* ---- 远侧手臂（在身体后面、压暗）：面朝右时远侧 = 左边那只 ---- */
    function arm(dir, phase, near) {
      var sx = x - A.shX + dir * 8.6, sy = y0 + 14;
      var ax = x + dir * (12.8 + sw * 1.6 + (near ? A.shX * 0.5 : -A.shX * 0.5));
      var ay = y0 + 29 - sw * 6.5 - phase * 3.6;
      limb(sx, sy, ax, ay, 6.0, near ? ROBE : ROBE_D);
      ctx.beginPath(); ctx.arc(ax, ay + 1.6, 2.8, 0, 7); fs(near ? SKIN : '#d9b48f', 1.5);
    }
    arm(-1, 0, false);

    /* ---- 佩剑：挂后腰，越侧越往后转（剑柄从背后翘出来） ---- */
    ctx.save();
    ctx.translate(x - 1.0 + A.swX, y0 + 24);
    ctx.rotate(A.swR);
    ctx.save(); ctx.rotate(-A.swR * 0.3);
    limb(0, 0, -13, 19, 3.8, '#2f3a46');                                   // 鞘（短一点：长了会飘出体外）
    ctx.save(); ctx.translate(-13, 19); ctx.rotate(0.9); rr(-3, -2.6, 6, 5.2, 2); fs(SASH, 1.1); ctx.restore();
    ctx.save(); ctx.translate(1.2, 0); ctx.rotate(-0.9); rr(-5.6, -1.4, 11.2, 2.8, 1.2); fs(SASH, 1.1); ctx.restore();
    limb(0.8, -1.6, 4.6, -7.5, 3.4, '#5a4634');
    ctx.beginPath(); ctx.arc(5.1, -8.6, 2.2, 0, 7); fs(SASH, 1.2);
    ctx.restore();
    ctx.restore();

    /* ---- 前腿（亮） ---- */
    leg(A.legF + step * 1.6, Math.max(0, step) * 2.6, '#3b2f22', '#22252a');

    /* ---- 身体：越侧越窄、肩线往朝向偏 ---- */
    var hw = A.hw, sh = x + A.shX;
    ctx.beginPath();
    ctx.moveTo(sh - hw, y0 + 27);
    ctx.lineTo(sh - hw + 1, y0 + 13);
    ctx.quadraticCurveTo(sh, y0 + 8, sh + hw, y0 + 13);
    ctx.lineTo(sh + hw + 0.5, y0 + 27);
    ctx.closePath();
    fs(ROBE, 2.2);
    ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(sh, y0 + 12, hw, 14);
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
    /* 交领：越侧越只看到近侧那半 */
    ctx.strokeStyle = '#e8e2d4'; ctx.lineWidth = 2.6; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(sh - hw + 1.5, y0 + 10.5); ctx.lineTo(sh + 0.5, y0 + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sh + hw - 1.5, y0 + 10.5); ctx.lineTo(sh - 0.6, y0 + 21); ctx.stroke();
    rr(sh - hw + 0.5, y0 + 22, hw * 2 - 1, 6.5, 2.5); fs(SASH, 1.6);
    rr(sh + A.shX * 0.9 - 2.5, y0 + 22.6, 5, 5.4, 1.6); fs(SASH_D, 1.2);

    /* ---- 近侧手臂：画在身体**前面**（面朝右 = 右边那只） ---- */
    arm(1, sw ? 1.0 : -step, true);

    /* ---- 头 + 脸（三层，别把后脑和帽子画成一块：那样会把脸糊住）----
       ① 后脑的头发：画在**脸之前**，只在背后那一侧露出来（正面时 hairB=0，直接不画 →
          正面那一格和现版完全一样）  ② 脸 + 眼睛 + 鼻尖  ③ 头顶那顶（盖在脸上方） */
    var hy = y0 + 3;
    if (A.hairB > 0) {
      ctx.beginPath();
      ctx.ellipse(hx - 3.0 - A.hairB * 0.5, hy + 0.6, 9.4 * A.hr, 9.6, 0, 0, 7);
      fs(HAIR, 2);
      if (A.hairB >= 3) {                                // 侧到半侧以上：后脑拖一缕发尾
        ctx.beginPath();
        ctx.moveTo(hx - 6 - A.hairB * 0.45, hy - 2);
        ctx.quadraticCurveTo(hx - 10 - A.hairB * 0.8, hy + 4, hx - 9.2 - A.hairB * 0.7, hy + 9.5);
        ctx.lineTo(hx - 5.6 - A.hairB * 0.45, hy + 9);
        ctx.quadraticCurveTo(hx - 7 - A.hairB * 0.5, hy + 5, hx - 3.5 - A.hairB * 0.35, hy + 1);
        ctx.closePath(); fs(HAIR, 1.7);
      }
    }
    ctx.beginPath(); ctx.ellipse(hx, hy, 9.4 * A.hr, 9.4, 0, 0, 7); fs(SKIN, 2);
    if (A.eyeF !== null) eyeDot(hx + A.eyeF, y0 + 5.4, 1.35, sw);
    eyeDot(hx + A.eyeN, y0 + 5.4, 1.35, sw);
    if (A.nose > 0) {                                    // 鼻尖：贴在朝向那一侧的轮廓外
      ctx.beginPath();
      ctx.moveTo(hx + 8.6 * A.hr, y0 + 2.8);
      ctx.lineTo(hx + 8.6 * A.hr + A.nose, y0 + 5.4);
      ctx.lineTo(hx + 8.4 * A.hr, y0 + 6.6);
      ctx.closePath(); fs(SKIN, 1.5);
    }
    /* ③ 头顶那顶（正面时和现版一致；侧身时往后收一点） */
    ctx.beginPath();
    ctx.arc(hx - A.hairB * 0.35, y0 + 1.4, 9.8, Math.PI * 1.02, Math.PI * 2.0);
    ctx.fillStyle = HAIR; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
    /* 头带 + 飘带（往身后飘：面朝右 = 往左） */
    rr(hx - 10.2, y0 - 1.6, 20.4, 4.2, 1.8); fs(SASH, 1.4);
    ctx.strokeStyle = SASH_D; ctx.lineWidth = 2; ctx.lineCap = 'round';
    var k = (sw ? 1 : 0.4) + A.rib * 0.5;
    ctx.beginPath(); ctx.moveTo(hx - 9, y0 + 1.5);
    ctx.quadraticCurveTo(hx - 16 - k * 3, y0 + 6 - k * 4, hx - 21 - k * 4, y0 + 3 - k * 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx - 8.5, y0 + 3.5);
    ctx.quadraticCurveTo(hx - 15 - k * 3, y0 + 10, hx - 20 - k * 5, y0 + 10 - k * 6); ctx.stroke();
  }

  for (var vi = 0; vi < ANG.length; vi++) {
    for (var pi = 0; pi < 2; pi++) {
      var cx = vi * CW, cy = pi * (CH + 20) + 18;
      ctx.save();
      ctx.fillStyle = '#3f6b33'; ctx.fillRect(cx + 4, cy, CW - 8, CH);
      ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx + 4.5, cy + 0.5, CW - 9, CH - 1);
      ctx.fillStyle = '#cfe9a8'; ctx.font = '600 12px "PingFang SC","Microsoft YaHei",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(ANG[vi].name + (pi ? ' · 挥砍（面朝左）' : ' · 待机（面朝右）'), cx + 8, cy - 4);
      ctx.translate(cx + CW / 2, cy + CH - 26);
      ctx.scale(ZOOM, ZOOM);
      var P = { x: 0, y: 0, step: pi ? 0.45 : 0 };
      if (pi) { ctx.save(); ctx.scale(-1, 1); }          // 下行镜像 = 面朝左（游戏里就这么翻）
      drawChar(P, ANG[vi], pi === 1);
      if (pi) ctx.restore();
      ctx.restore();
    }
  }
  document.title = 'READY ' + outCv.width + 'x' + outCv.height;
  } catch (e) {
    document.title = 'ERR: ' + (e && e.message ? e.message : e);
  }
})();
</script>
</body>
</html>
