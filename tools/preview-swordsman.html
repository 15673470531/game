<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色 · 剑客方向小样</title>
<style>*{margin:0;padding:0}html,body{background:#0d0f12}canvas{display:block}</style>
</head>
<body>
<!--
  「角色能不能像剑客一点」小样：**这个页面不改游戏代码**（drawPlayer 一行没动），
  这里用同一套画法（纯色块 + 深色勾线 + 同样的身高/落地线）手画四个方向做对照：

    ① 现版（对照）
    ② 斗笠 + 交领长袍 + 绑腿（草帽剑客）—— 剪影最有辨识度，帽子顺手解决"头小/没发型"
    ③ 束发头带 + 短打劲装 + 背后一把剑（江湖剑客）—— 背后那把剑是"剑客"最强的符号
    ④ 宽袖长袍 + 披风（剑侠）—— 更飘逸，靠衣袂和披风动

  每列两行：上=待机，下=挥砍（手臂抬起、眯眼、衣袂/飘带跟着动）。
  共同约束：落地线、身高、头的大小都和现版一致（判定/血条位置不受影响）；
           手里仍然不拿武器（武器只在轨道上转）——③ 那把剑是**背在背后**的，不是拿在手里。
  用法：bash tools/shot-boss.sh swordsman   → docs/player-swordsman.png
-->
<canvas id="out" width="812" height="430"></canvas>
<script>
(function () {
  try {
  var CW = 203, CH = 190, COLS = 4, ZOOM = 2.3;
  var outCv = document.getElementById('out');
  outCv.width = COLS * CW;
  outCv.height = 2 * (CH + 20) + 18;
  var ctx = outCv.getContext('2d');

  var OUT = '#1b1f26';
  var SKIN = '#f2cda6', HAIR = '#141519';
  var ROBE = '#37587f', ROBE_D = '#2b4666', SASH = '#c9a24a', SASH_D = '#8f6f26';
  var WRAP = '#3a3f46', BOOT = '#22252a';

  /* ---------- 工具 ---------- */
  function rr(x, y, w, h, r) {
    var q = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + q, y); ctx.lineTo(x + w - q, y); ctx.arcTo(x + w, y, x + w, y + q, q);
    ctx.lineTo(x + w, y + h - q); ctx.arcTo(x + w, y + h, x + w - q, y + h, q);
    ctx.lineTo(x + q, y + h); ctx.arcTo(x, y + h, x, y + h - q, q);
    ctx.lineTo(x, y + q); ctx.arcTo(x, y, x + q, y, q); ctx.closePath();
  }
  function fillStroke(fill, lw) {
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = lw || 1.7; ctx.stroke();
  }
  function limb(x1, y1, x2, y2, w, col) {         // 一节肢体（粗线 + 勾线）
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 2.4; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }

  /* ---------- 骨架（四个方向共用：身高/落地线和现版一致） ---------- */
  function drawCommon(P, pose, opt) {
    var x = P.x, y0 = P.y - 42 + P.bob;
    var step = P.step, sw = pose === 'swing' ? 1 : 0;
    var armL = pose === 'swing' ? 1.0 : -step, armR = pose === 'swing' ? 0.3 : step;

    /* 腿（绑腿 / 布靴） */
    function leg(dx, lift, withWrap) {
      rr(x + dx, P.y - 17, 6.8, 17 - lift, 2.6); fillStroke('#3b2f22', 1.6);
      if (withWrap) {                                  // 绑腿：两道斜缠
        ctx.strokeStyle = '#6c6152'; ctx.lineWidth = 1.3;
        for (var w = 0; w < 2; w++) {
          var wy = P.y - 15 + w * 5 - lift;
          ctx.beginPath(); ctx.moveTo(x + dx - 0.5, wy); ctx.lineTo(x + dx + 7.3, wy + 2.6); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x + dx - 0.5, wy + 2.6); ctx.lineTo(x + dx + 7.3, wy); ctx.stroke();
        }
      }
      rr(x + dx - 1.5, P.y - 4 - lift, 9.8, 5.6, 2); fillStroke(BOOT, 1.6);
    }
    leg(-8 - step * 1.8, Math.max(0, step) * 2.6, opt.wrap);
    leg(1.5 + step * 1.8, Math.max(0, -step) * 2.6, opt.wrap);

    /* 背后的东西（剑 / 披风）要在身体之前画 */
    if (opt.back) opt.back(x, y0, sw);

    /* 手臂（宽袖 / 窄袖） */
    function arm(side, phase) {
      var sx = x + side * 8.6, sy = y0 + 14;
      var hx = x + side * (12.8 + sw * 1.6), hy = y0 + 29 - sw * 6.5 - phase * 3.6;
      limb(sx, sy, hx, hy, opt.sleeveW || 6.2, opt.sleeveCol || ROBE_D);
      if (opt.wideSleeve) {                            // 宽袖：袖口一块布垂下来
        ctx.beginPath();
        ctx.moveTo(hx - side * 1.5, hy - 5); ctx.lineTo(hx + side * 3.6, hy - 2);
        ctx.lineTo(hx + side * 3.2, hy + 4.5); ctx.lineTo(hx - side * 2, hy + 3); ctx.closePath();
        fillStroke(opt.sleeveCol || ROBE, 1.5);
      }
      ctx.beginPath(); ctx.arc(hx, hy + 1.6, 2.8, 0, 7); fillStroke(SKIN, 1.5);
    }
    arm(-1, armL); arm(1, armR);

    /* 身体 */
    opt.body(x, y0, sw);
    /* 头 */
    opt.head(x, y0, pose);
  }

  /* ================= ① 现版（对照，和游戏里一致） ================= */
  function variantNow(P, pose) {
    drawCommon(P, pose, {
      sleeveCol: '#35597a', sleeveW: 6.2, wrap: false,
      body: function (x, y0) {
        ctx.beginPath();
        ctx.moveTo(x - 12, y0 + 34); ctx.lineTo(x - 10, y0 + 13);
        ctx.quadraticCurveTo(x, y0 + 8, x + 10, y0 + 13);
        ctx.lineTo(x + 12, y0 + 34); ctx.closePath();
        fillStroke('#3f6ea3', 2.2);
        ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(x, y0 + 11, 12, 23);
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
        rr(x - 10.5, y0 + 22, 21, 4.6, 2); fillStroke('#2e5479', 1.5);
      },
      head: function (x, y0, pose) {
        ctx.beginPath(); ctx.arc(x, y0 + 3, 9.4, 0, 7); fillStroke('#f0c8a2', 2);
        eyes(x, y0 + 4.8, pose === 'swing');
        ctx.beginPath(); ctx.arc(x, y0 + 1.6, 9.8, Math.PI * 1.02, Math.PI * 2.0); fillStroke(HAIR, 2);
      }
    });
  }
  function eyes(x, y, squint) {
    ctx.lineCap = 'round';
    if (squint) {
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - 3.3 - 1.4, y - 1.3); ctx.lineTo(x - 3.3 + 1.3, y + 1.1);
      ctx.moveTo(x + 3.3 - 1.3, y + 1.1); ctx.lineTo(x + 3.3 + 1.4, y - 1.3);
      ctx.stroke();
    } else {
      ctx.fillStyle = OUT;
      ctx.beginPath(); ctx.arc(x - 3.3, y, 1.35, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 3.3, y, 1.35, 0, 7); ctx.fill();
    }
  }

  /* ================= ② 斗笠 + 交领长袍 + 绑腿 ================= */
  function variantHat(P, pose) {
    drawCommon(P, pose, {
      sleeveCol: ROBE_D, sleeveW: 6.4, wrap: true,
      body: function (x, y0, sw) {
        /* 长袍：下摆更低 + 中间开叉（两片） */
        ctx.beginPath();
        ctx.moveTo(x - 13, y0 + 41); ctx.lineTo(x - 10.5, y0 + 13);
        ctx.quadraticCurveTo(x, y0 + 8, x + 10.5, y0 + 13);
        ctx.lineTo(x + 13, y0 + 41);
        ctx.lineTo(x + 2, y0 + 37); ctx.lineTo(x, y0 + 30); ctx.lineTo(x - 2, y0 + 37);
        ctx.closePath();
        fillStroke(ROBE, 2.2);
        ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x + 0.5, y0 + 12, 12, 27);
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
        /* 交领右衽：两道斜线汇到胸前 */
        ctx.strokeStyle = '#e8e2d4'; ctx.lineWidth = 2.4; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(x - 7.5, y0 + 10.5); ctx.lineTo(x + 0.5, y0 + 22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 7.5, y0 + 10.5); ctx.lineTo(x - 0.6, y0 + 23); ctx.stroke();
        /* 腰带 + 一侧飘带（挥砍时飘起来） */
        rr(x - 11, y0 + 24, 22, 5, 2); fillStroke(SASH, 1.5);
        ctx.beginPath();
        ctx.moveTo(x - 9, y0 + 29);
        ctx.quadraticCurveTo(x - 13 - sw * 3, y0 + 36, x - 10 - sw * 5, y0 + 46);
        ctx.lineTo(x - 6 - sw * 4, y0 + 44);
        ctx.quadraticCurveTo(x - 8, y0 + 36, x - 5, y0 + 29);
        ctx.closePath(); fillStroke(SASH_D, 1.5);
      },
      head: function (x, y0, pose) {
        ctx.beginPath(); ctx.arc(x, y0 + 3, 9.4, 0, 7); fillStroke(SKIN, 2);
        eyes(x, y0 + 5.2, pose === 'swing');
        ctx.beginPath(); ctx.arc(x, y0 + 1.6, 9.8, Math.PI * 1.02, Math.PI * 2.0); fillStroke(HAIR, 2);
        /* 斗笠：宽檐一顶，檐口露出脸；顶上一个小珠（原来画了根竖线，像插了根棍） */
        ctx.beginPath();
        ctx.moveTo(x - 15.5, y0 + 1); ctx.quadraticCurveTo(x, y0 - 17, x + 15.5, y0 + 1);
        ctx.lineTo(x + 11, y0 + 3.2); ctx.quadraticCurveTo(x, y0 - 8, x - 11, y0 + 3.2);
        ctx.closePath(); fillStroke('#c9a465', 2);
        ctx.strokeStyle = '#8f6f26'; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(x - 13.5, y0 + 0.4);
        ctx.quadraticCurveTo(x, y0 - 12.5, x + 13.5, y0 + 0.4); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y0 - 15.6, 1.9, 0, 7); fillStroke(SASH, 1.2);
      }
    });
  }

  /* ================= ③ 束发头带 + 短打 + 背后一把剑 ================= */
  function variantBand(P, pose) {
    drawCommon(P, pose, {
      sleeveCol: ROBE_D, sleeveW: 6.0, wrap: true,
      back: function (x, y0, sw) {
        /* 腰间佩剑（不是背在背后）：剑柄+护手挂在右腰，鞘斜到左下方、末端露在下摆外。
           ⚠️ 为什么不背在背后：角色头顶那条空间被血/经验条占了（头顶上方只剩约 7px），
              剑柄竖起来会顶到血条 —— 挂腰上既有"剑客"符号，又不抢 HUD。 */
        limb(x + 13, y0 + 21, x - 7, y0 + 47, 4.0, '#2f3a46');            // 鞘
        ctx.save(); ctx.translate(x - 7, y0 + 47); ctx.rotate(0.9);        // 鞘尾（金属包头）
        rr(-3.2, -2.8, 6.4, 5.6, 2); fillStroke(SASH, 1.1); ctx.restore();
        ctx.save(); ctx.translate(x + 13.5, y0 + 19.5); ctx.rotate(-0.9);  // 护手（跟着鞘的斜度）
        rr(-5.8, -1.4, 11.6, 2.8, 1.2); fillStroke(SASH, 1.1); ctx.restore();
        limb(x + 14.5, y0 + 17.5, x + 18.5, y0 + 11, 3.6, '#5a4634');      // 握柄
        ctx.beginPath(); ctx.arc(x + 19.2, y0 + 10, 2.3, 0, 7); fillStroke(SASH, 1.2);   // 柄头
      },
      body: function (x, y0, sw) {
        /* 短打劲装：下摆短、宽腰带 */
        ctx.beginPath();
        ctx.moveTo(x - 12, y0 + 27); ctx.lineTo(x - 10.5, y0 + 13);
        ctx.quadraticCurveTo(x, y0 + 8, x + 10.5, y0 + 13);
        ctx.lineTo(x + 12, y0 + 27); ctx.closePath();
        fillStroke(ROBE, 2.2);
        ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x + 0.5, y0 + 12, 11, 13);
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.strokeStyle = '#e8e2d4'; ctx.lineWidth = 2.6; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(x - 7.5, y0 + 10.5); ctx.lineTo(x + 0.5, y0 + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 7.5, y0 + 10.5); ctx.lineTo(x - 0.6, y0 + 21); ctx.stroke();
        rr(x - 11.5, y0 + 22, 23, 6.5, 2.5); fillStroke(SASH, 1.6);
        rr(x - 2.5, y0 + 22.6, 5, 5.4, 1.6); fillStroke(SASH_D, 1.2);        // 腰扣
      },
      head: function (x, y0, pose) {
        ctx.beginPath(); ctx.arc(x, y0 + 3, 9.4, 0, 7); fillStroke(SKIN, 2);
        eyes(x, y0 + 5.4, pose === 'swing');
        ctx.beginPath(); ctx.arc(x, y0 + 1.4, 9.8, Math.PI * 1.02, Math.PI * 2.0); fillStroke(HAIR, 2);
        /* 头带 + 两条飘带（挥砍时飘得更开） */
        rr(x - 10.2, y0 - 1.6, 20.4, 4.2, 1.8); fillStroke(SASH, 1.4);
        ctx.strokeStyle = SASH_D; ctx.lineWidth = 2; ctx.lineCap = 'round';
        var k = pose === 'swing' ? 1 : 0.4;
        ctx.beginPath(); ctx.moveTo(x - 9, y0 + 1);
        ctx.quadraticCurveTo(x - 16 - k * 3, y0 + 6 - k * 4, x - 20 - k * 4, y0 + 3 - k * 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - 8.5, y0 + 3);
        ctx.quadraticCurveTo(x - 15 - k * 3, y0 + 10, x - 19 - k * 5, y0 + 10 - k * 6); ctx.stroke();
      }
    });
  }

  /* ================= ④ 宽袖长袍 + 披风 ================= */
  function variantCape(P, pose) {
    drawCommon(P, pose, {
      sleeveCol: ROBE, sleeveW: 7, wrap: false, wideSleeve: true,
      back: function (x, y0, sw) {
        /* 披风：连肩一片，下摆带波浪（收窄过：太宽会变成一口钟，把手臂全盖住） */
        ctx.beginPath();
        ctx.moveTo(x - 11, y0 + 12);
        ctx.quadraticCurveTo(x - 17 - sw * 3, y0 + 30, x - 14 - sw * 4, y0 + 46);
        ctx.quadraticCurveTo(x - 7, y0 + 42, x, y0 + 45);
        ctx.quadraticCurveTo(x + 7, y0 + 42, x + 14 - sw * 4, y0 + 46);
        ctx.quadraticCurveTo(x + 17 - sw * 3, y0 + 30, x + 11, y0 + 12);
        ctx.closePath(); fillStroke('#2b3d55', 2.2);
        ctx.fillStyle = 'rgba(255,255,255,.05)';
        ctx.beginPath(); ctx.moveTo(x - 11, y0 + 12); ctx.lineTo(x - 4, y0 + 12);
        ctx.lineTo(x - 8 - sw * 3, y0 + 43); ctx.lineTo(x - 13 - sw * 4, y0 + 44);
        ctx.closePath(); ctx.fill();
      },
      body: function (x, y0, sw) {
        ctx.beginPath();
        ctx.moveTo(x - 12.5, y0 + 40); ctx.lineTo(x - 10.5, y0 + 13);
        ctx.quadraticCurveTo(x, y0 + 8, x + 10.5, y0 + 13);
        ctx.lineTo(x + 12.5, y0 + 40);
        ctx.lineTo(x + 2, y0 + 36); ctx.lineTo(x, y0 + 29); ctx.lineTo(x - 2, y0 + 36);
        ctx.closePath(); fillStroke(ROBE, 2.2);
        ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x + 0.5, y0 + 12, 12, 26);
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.strokeStyle = '#e8e2d4'; ctx.lineWidth = 2.4; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(x - 7.5, y0 + 10.5); ctx.lineTo(x + 0.5, y0 + 22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 7.5, y0 + 10.5); ctx.lineTo(x - 0.6, y0 + 23); ctx.stroke();
        rr(x - 10.5, y0 + 24, 21, 4.6, 2); fillStroke(SASH, 1.5);
        /* 腰间挂一枚玉佩（垂在左侧，挥砍时甩起来） */
        ctx.strokeStyle = SASH_D; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x - 8, y0 + 28.5); ctx.lineTo(x - 9 - sw * 2, y0 + 36); ctx.stroke();
        ctx.beginPath(); ctx.arc(x - 9 - sw * 2, y0 + 38.5, 2.4, 0, 7); fillStroke('#7fc7a8', 1.2);
      },
      head: function (x, y0, pose) {
        ctx.beginPath(); ctx.arc(x, y0 + 3, 9.4, 0, 7); fillStroke(SKIN, 2);
        eyes(x, y0 + 5, pose === 'swing');
        ctx.beginPath(); ctx.arc(x, y0 + 1.4, 9.8, Math.PI * 1.02, Math.PI * 2.0); fillStroke(HAIR, 2);
        /* 发髻 + 后面一缕长发（比头带更有"剑侠"味） */
        ctx.beginPath(); ctx.arc(x, y0 - 8.5, 4.2, 0, 7); fillStroke(HAIR, 1.6);
        ctx.beginPath();
        ctx.moveTo(x + 8, y0 + 3);
        ctx.quadraticCurveTo(x + 12.5, y0 + 14, x + 10, y0 + 25);
        ctx.lineTo(x + 7, y0 + 23.5);
        ctx.quadraticCurveTo(x + 9.5, y0 + 14, x + 5.5, y0 + 5);
        ctx.closePath(); fillStroke(HAIR, 1.5);
      }
    });
  }

  var VARIANTS = [
    { name: '① 现版（对照）', fn: variantNow },
    { name: '② 斗笠 · 长袍 · 绑腿', fn: variantHat },
    { name: '③ 头带 · 短打 · 佩剑', fn: variantBand },
    { name: '④ 宽袖 · 披风 · 发髻', fn: variantCape }
  ];
  var POSES = ['idle', 'swing'];

  for (var vi = 0; vi < VARIANTS.length; vi++) {
    for (var pi = 0; pi < POSES.length; pi++) {
      var cx = vi * CW, cy = pi * (CH + 20) + 18;
      ctx.save();
      ctx.fillStyle = '#3f6b33'; ctx.fillRect(cx + 4, cy, CW - 8, CH);
      ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx + 4.5, cy + 0.5, CW - 9, CH - 1);
      ctx.fillStyle = '#cfe9a8'; ctx.font = '600 12px "PingFang SC","Microsoft YaHei",monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(VARIANTS[vi].name + (pi ? ' · 挥砍' : ' · 待机'), cx + 8, cy - 4);
      /* 角色：脚踩在格子下方 26px，2.3 倍 */
      ctx.translate(cx + CW / 2, cy + CH - 26);
      ctx.scale(ZOOM, ZOOM);
      var P = { x: 0, y: 0, bob: 0, step: 0 };
      if (pi === 1) P.step = 0.55;
      VARIANTS[vi].fn(P, POSES[pi]);
      ctx.restore();
    }
  }
  document.title = 'READY ' + outCv.width + 'x' + outCv.height;
  } catch (e) {
    document.title = 'ERR: ' + (e && e.message ? e.message : e);
  }
})();
</script>
</body>
</html>
