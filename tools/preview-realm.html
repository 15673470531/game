<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>遗落祭坛</title><style>*{box-sizing:border-box}body{margin:0;background:#101d24;color:#dfe8df;font:15px system-ui}header{padding:24px 32px}h1{font-size:27px;margin:0 0 8px}p{margin:0;color:#91aca9}nav{padding:0 32px 18px;display:flex;gap:10px}button{background:#2d484b;border:1px solid #577b75;color:#e1eee7;padding:9px 16px;border-radius:7px;cursor:pointer}canvas{display:block;margin:auto}#note{padding:14px 32px;font-size:13px}</style><header><h1>遗落祭坛 · 第一关</h1><p>祭坛苏醒 → 荒村异动 → 巨蝎降临 · 实际游戏渲染预览</p></header><nav><button onclick="mode=0">整张地图</button><button onclick="mode=1">出生祭坛</button><button onclick="mode=2">荒村枯井</button><button onclick="mode=3">竹林</button><button onclick="mode=4">巨树裂隙</button><button onclick="g.wave=g.wave%3+1;g.trial.eliteDead=false">切换波次</button><button onclick="playing=!playing;g.player.inv=99999">试玩 / 暂停</button></nav><canvas id="out" width="1200" height="800"></canvas><p id="note">方向键 / WASD 移动 · 试玩使用原有战斗逻辑（预览角色无敌） · 点击场景按钮查看细节</p>
<script src="../core/config.js"></script><script src="../core/world.js"></script><script src="../core/entities.js"></script><script src="../core/progression.js"></script><script src="../core/save.js"></script><script src="../core/game.js"></script><script src="../render/renderer.js"></script><script>
var G=window.__GAME__,cv=document.getElementById('out'),ctx=cv.getContext('2d'),g=new G.Game(G.Config,{World:G.World,Entities:G.Entities,Progression:G.Progression,Save:G.Save});g.setViewport(1200,800);g.state='play';g.trial.delay=0;
var r=new G.Renderer(ctx,{cfg:G.Config,createCanvas:function(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}});r.resize(1200,800);r.buildGround(g.world);
var mode=0,playing=false,keys={},last=0;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;
function draw(t){try{var dt=Math.min(.033,(t-last)/1000||0);last=t;var L=g.world.landmarks;
if(playing){var x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);g.update(dt,{moveX:x,moveY:y});if(g.state==='levelup'){g.player.pendingLevels=0;g.cards=[];g.state='play';}r.draw(g,t/1000);}
else{ctx.fillStyle='#15252c';ctx.fillRect(0,0,1200,800);ctx.save();if(mode===0)ctx.scale(.5,.5);else{var point=mode===1?L.altar:mode===2?L.well:mode===3?{x:1900,y:800}:{x:L.ancientTree.x,y:L.ancientTree.y+50};ctx.translate(600-point.x,400-point.y);}ctx.drawImage(r.ground,0,0);r.viewX=0;r.viewY=0;r.zoom=1;r.w=2400;r.h=1600;r.drawRocks(g.world.rocks.filter(o=>!o.landmark));r.drawWalls(g.world.walls.filter(o=>!o.ruin));r.drawRealmScene(g,t/1000);r.drawPlayer(g.player,t/1000);ctx.restore();r.w=1200;r.h=800;if(mode===0){ctx.font='16px system-ui';ctx.fillStyle='#c5d6cd';[['归来祭坛',L.altar.x/2,L.altar.y/2+99],['荒村',240,240],['封印枯井',L.well.x/2,L.well.y/2-52],['青冥竹林',1000,370],['古树裂隙',L.ancientTree.x/2,55]].forEach(a=>ctx.fillText(a[0],a[1]-30,a[2]));}}
document.title='READY 遗落祭坛';requestAnimationFrame(draw);}catch(e){document.title='ERR '+e.message;document.getElementById('note').textContent=e.stack;}}
requestAnimationFrame(draw);
</script></html>
